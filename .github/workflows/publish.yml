---
name: Publish

on:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Build image
        run: make image

      - name: Build page
        run: make build

      - name: Validate page
        run: make validate

      - name: Upload web site as artifact
        uses: actions/upload-artifact@v7
        with:
          name: public
          path: public
          retention-days: 7

  publish:
    name: Publish
    needs:
      - build
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out repository (current branch)
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          path: source

      - name: Check out repository (public branch)
        uses: actions/checkout@v6
        with:
          ref: public
          path: prev-public
          token: "${{ github.token }}"
          fetch-depth: 0

      - name: Download web site artifact
        uses: actions/download-artifact@v8
        with:
          name: public
          path: "${{ github.workspace }}/public"

      - name: Publish web site
        run: bash source/build/publish.sh
        env:
          SOURCE: "${{ github.workspace }}/source"
          PREV_PUBLIC: "${{ github.workspace }}/prev-public"
          PUBLIC: "${{ github.workspace }}/public"
          SITE_NAME: "elektrubadur-se"
          GIT_CONFIG_COUNT: "1"
          GIT_CONFIG_KEY_0: "url.https://nobody:${{ github.token }}@github.com/.insteadOf"
          GIT_CONFIG_VALUE_0: "https://github.com/"
